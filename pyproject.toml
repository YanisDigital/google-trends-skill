[tool.ruff]
line-length = 150
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B905"]

[tool.ruff.lint.per-file-ignores]
"skills/google-trends/scripts/trends_cli.py" = ["E402"]
"tests/*" = ["E402"]
"skills/google-trends/scripts/gtrends/report_html.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
